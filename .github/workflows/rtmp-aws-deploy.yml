name: RTMP AWS Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "CDK action to run"
        required: true
        type: choice
        default: "deploy"
        options:
          - synth
          - deploy
          - destroy
      deploy_mode:
        description: "Infra mode"
        required: true
        type: choice
        default: "cheap"
        options:
          - cheap
          - managed
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "us-east-1"
      desired_app_count:
        description: "Number of app nodes/tasks"
        required: true
        type: number
        default: 1
      max_app_count:
        description: "Maximum cheap-mode demo app ports to expose"
        required: true
        type: number
        default: 3
      instance_type:
        description: "Cheap-mode ECS EC2 instance type"
        required: true
        type: string
        default: "t3.micro"
      rtmp_host:
        description: "RTMP host advertised to streamers. For cheap mode, redeploy with the EC2 public DNS/IP after first deploy."
        required: false
        type: string
        default: "replace-after-deploy.example.com"
      admin_cidr:
        description: "CIDR allowed to SSH to cheap-mode EC2"
        required: false
        type: string
        default: "0.0.0.0/0"
      enable_alb:
        description: "Managed mode: create ALB for HTTP/UI/API"
        required: false
        type: boolean
        default: false
      enable_nlb:
        description: "Managed mode: create NLB for RTMP"
        required: false
        type: boolean
        default: false
      enable_elasticache:
        description: "Managed mode: create shared ElastiCache Redis"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rtmp-aws-${{ inputs.deploy_mode }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  ECR_REPOSITORY: rtmp-demo
  INFRA_DIR: java/rtmp/infra/aws

jobs:
  cdk:
    name: ${{ inputs.action }} ${{ inputs.deploy_mode }} stack
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CDK dependencies
        working-directory: ${{ env.INFRA_DIR }}
        run: npm install

      - name: Build CDK app
        working-directory: ${{ env.INFRA_DIR }}
        run: npm run build

      - name: Ensure ECR repository exists
        if: ${{ inputs.action == 'deploy' }}
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null

      - name: Log in to Amazon ECR
        if: ${{ inputs.action == 'deploy' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ inputs.action == 'deploy' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        if: ${{ inputs.action == 'deploy' }}
        id: image
        uses: docker/build-push-action@v6
        with:
          context: java/rtmp
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve app image
        id: app-image
        run: |
          if [ "${{ inputs.action }}" = "deploy" ]; then
            echo "uri=${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=public.ecr.aws/docker/library/eclipse-temurin:21-jre" >> "$GITHUB_OUTPUT"
          fi

      - name: CDK synth
        if: ${{ inputs.action == 'synth' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk synth \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: CDK deploy
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk deploy --require-approval never \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: Stop ECS services before destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          if [ "${{ inputs.deploy_mode }}" = "managed" ]; then
            STACK_NAME="RtmpManagedDemoStack"
          else
            STACK_NAME="RtmpCheapDemoStack"
          fi

          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            echo "Stack $STACK_NAME does not exist; skipping ECS service drain."
            exit 0
          fi

          CLUSTER=$(
            aws cloudformation describe-stack-resources \
              --stack-name "$STACK_NAME" \
              --query "StackResources[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId | [0]" \
              --output text
          )
          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
            echo "No ECS cluster found in $STACK_NAME; skipping ECS service drain."
            exit 0
          fi

          mapfile -t SERVICES < <(
            aws cloudformation describe-stack-resources \
              --stack-name "$STACK_NAME" \
              --query "StackResources[?ResourceType=='AWS::ECS::Service'].PhysicalResourceId" \
              --output text | tr '\t' '\n'
          )

          ACTIVE_SERVICES=()
          for SERVICE in "${SERVICES[@]}"; do
            if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
              continue
            fi
            echo "Scaling ECS service $SERVICE to 0."
            if aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count 0 >/dev/null; then
              ACTIVE_SERVICES+=("$SERVICE")
            else
              echo "Could not scale $SERVICE; it may already be deleting."
            fi
          done

          if [ "${#ACTIVE_SERVICES[@]}" -gt 0 ]; then
            aws ecs wait services-stable --cluster "$CLUSTER" --services "${ACTIVE_SERVICES[@]}"
          fi

          mapfile -t TASKS < <(
            {
              aws ecs list-tasks --cluster "$CLUSTER" --desired-status RUNNING --query "taskArns" --output text
              aws ecs list-tasks --cluster "$CLUSTER" --desired-status PENDING --query "taskArns" --output text
            } | tr '\t' '\n'
          )

          ACTIVE_TASKS=()
          for TASK in "${TASKS[@]}"; do
            if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
              continue
            fi
            echo "Stopping ECS task $TASK."
            if aws ecs stop-task --cluster "$CLUSTER" --task "$TASK" --reason "GitHub Actions destroy cleanup" >/dev/null; then
              ACTIVE_TASKS+=("$TASK")
            else
              echo "Could not stop $TASK; it may already be stopping."
            fi
          done

          if [ "${#ACTIVE_TASKS[@]}" -gt 0 ]; then
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "${ACTIVE_TASKS[@]}"
          fi

      - name: CDK destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk destroy --force \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"
